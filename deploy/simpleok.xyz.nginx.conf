server {
    listen 80;
    server_name simpleok.xyz www.simpleok.xyz;

    root /var/www/simpleok/public;
    index index.php index.html;

    access_log /var/log/nginx/simpleok.access.log;
    error_log /var/log/nginx/simpleok.error.log;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock; # adjust PHP-FPM socket or host:port
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.ht {
        deny all;
    }

    # Optional: redirect to https (if you have SSL configured via certbot)
    # return 301 https://$host$request_uri;
}
